[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-k8s-privesc"
version = "0.1.0"
description = "Unified Cross-Layer Privilege Escalation Analysis and Remediation Framework for AWS IAM + Kubernetes RBAC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3==1.43.36",
    "kubernetes==36.0.2",
    "networkx==3.6.1",
    "matplotlib==3.11.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
privesc-scan = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["ingestion*", "graph*", "pathfinder*", "scoring*", "remediation*"]
