[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-k8s-privesc"
version = "0.1.0"
description = "Unified Cross-Layer Privilege Escalation Analysis and Remediation Framework for AWS IAM + Kubernetes RBAC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "kubernetes>=29.0.0",
    "networkx>=3.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
privesc-scan = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["ingestion*", "graph*", "pathfinder*", "scoring*", "remediation*"]
